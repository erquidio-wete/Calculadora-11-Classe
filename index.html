<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora 11ª Classe - Erquidio Wete</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.calc{background:#1e293b;padding:20px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5);width:300px}
.display{background:#0f172a;padding:15px;border-radius:10px;text-align:right;font-size:32px;margin-bottom:15px;min-height:50px;word-wrap:break-word}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{padding:20px;border:none;border-radius:10px;font-size:20px;cursor:pointer;background:#334155;color:white}
button.oper{background:#f59e0b} button.igual{background:#22c55e} button.limpar{background:#ef4444}
h3{text-align:center;color:#38bdf8} p{text-align:center;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<div class="calc">
<h3>Calculadora 11ª Classe</h3>
<div class="display" id="display">0</div>
<div class="buttons">
<button class="limpar" onclick="limpar()">C</button>
<button onclick="apagar()">⌫</button>
<button onclick="add('%')">%</button>
<button class="oper" onclick="add('/')">÷</button>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="oper" onclick="add('*')">×</button>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="oper" onclick="add('-')">-</button>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="oper" onclick="add('+')">+</button>
<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="add('(')">(</button>
<button onclick="add(')')">)</button>
<button class="igual" style="grid-column:span 4" onclick="calcular()">= CALCULAR</button>
</div>
<p>Feito por Erquidio Wete - Matola, Moçambique<br>Projeto para Portfólio GitHub</p>
</div>
<script>
let d=document.getElementById('display')
function add(v){if(d.innerText=='0')d.innerText=v;else d.innerText+=v}
function limpar(){d.innerText='0'} 
function apagar(){d.innerText=d.innerText.slice(0,-1)||'0'}
function calcular(){try{d.innerText=eval(d.innerText)}catch{d.innerText='Erro'}}
</script>
</body>
</html>
